services:
  - type: web
    name: yojana-dost-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/chat/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: RAG_ENABLED
        value: "true"
      - key: SCHEMES_FILE_PATH
        value: dist/data/schemes.json
      - key: GENERATION_MODEL
        value: meta/llama-3.2-11b-vision-instruct
      - key: OPENAI_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
